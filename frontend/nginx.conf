server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # App a pagina singola (expo-router): ogni percorso sconosciuto (es. /verify_email?token=...)
    # viene servito da index.html, poi è il router lato client a mostrare la schermata giusta.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
